[project]
name = "universal-modder"
version = "0.2.0"
description = "Tools and a shared knowledge base for AI agents that mod games: engine scanner, fal asset generation, sprite and 3D-to-sprite pipelines, window capture and input on Windows, showcase video editing, field notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Everything `pytest tests` needs beyond the runtime dependencies, so that a clone can be
# tested with one command: `pip install -e '.[dev]'`. py7zr unpacks the reference archives the
# fixture tests read; hypothesis drives tests/test_reader_fuzz.py; the 2B templates are not a
# Python dependency at all (tests/conftest.py extracts them, or skips with the command).
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "py7zr>=1",
    "ruff>=0.17",
    "mypy>=2.4",
    "imageio-ffmpeg>=0.6",
]
# The two optional readers that a dev checkout can use to cross-check more (`--extras` of
# tools/pd2-las/recover_env.sh). Tests that need them skip without them, here and in CI.
extras = [
    "lupa>=2",
    "sourcepp>=1",
]

[project.scripts]
um = "um.cli:main"

[project.urls]
Source = "https://github.com/Man1nWhite/universal-modder"
Upstream = "https://github.com/rehan-remade/universal-modder"
Field-notes = "https://github.com/rehan-remade/universal-modder/tree/main/knowledge"
Issues = "https://github.com/Man1nWhite/universal-modder/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["um"]

[tool.pytest.ini_options]
# `pytest tests` and a bare `pytest` from the repository root are the same run.
testpaths = ["tests"]
# pytest's defaults, plus the trees that hold game-shaped projects rather than this suite:
# `examples/` are worked mod projects, `docs/` and `knowledge/` are Markdown, `references/` is
# source archives. A bare `pytest` from the root must not spend minutes collecting them.
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "examples", "docs", "knowledge", "references", "scratch", "preview_tmp",
]
markers = [
    "slow: takes more than a few seconds (the builders and the pack rebuilds)",
]

[tool.ruff]
# The lint gate: `ruff check` from the repository root, the same command CI and
# `make -sC tools/pd2-las green` run (tests/test_one_implementation.py keeps them equal).
target-version = "py311"
line-length = 120
# the same trees pytest collects: examples/ are worked mod projects, the rest are docs,
# source archives and build output
extend-exclude = ["examples", "references", "docs", "knowledge", "build", "node_modules"]

[tool.ruff.lint]
# pyflakes' whole set (the previous gate) plus the import checks, the pycodestyle
# statements that catch two statements where one was meant, and bugbear: loop-variable
# closures, silent `assert` misuse, mutable defaults.
select = ["F", "E4", "E7", "E9", "B"]
ignore = [
    "E701",   # `if x: return` on one line is deliberate in these scripts
    "E702",   # `a; b` on one line likewise
    "E731",   # a lambda bound to a name is the clearest form for a sort key
    "E741",   # `l`, `I`, `O` appear in the math whose notation they are
    "E402",   # the tools put tools/pd2-las on sys.path before importing from it
    "B905",   # zip(strict=) is a behaviour change across 69 call sites, decided separately
    "B023",   # the closures over a loop variable are called inside the same iteration
    "B007",   # `for _i, x in enumerate` names the index as documentation
]

[tool.mypy]
# Scoped to the byte-critical code: the two file codecs whose output is a tracked pack,
# and the table/paths/status modules every builder reads. `python -m mypy` from the root
# checks exactly these; the rest of `um/` has 57 findings of its own (mostly platform
# attributes) and is not claimed as typed.
python_version = "3.11"
files = [
    "tools/pd2-las/diesel_model.py",
    "tools/pd2-las/las_outfit_pack.py",
    "tools/pd2-las/packs.py",
    "tools/pd2-las/dist_paths.py",
    "tools/pd2-las/status.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
# What the floor covers: the CLI and the pack toolchain. The gate runs with the suite
# (`--cov --cov-fail-under`, in check_all.py --full and the test workflow), so a change
# that deletes tests instead of code cannot pass by shrinking the denominator quietly.
source = ["um", "tools/pd2-las"]
branch = false

[tool.coverage.report]
# The floor is a ratchet, not a target: today's number rounded down by a point, raised
# when the suite earns it. Excluded lines are the ones that cannot run in CI at all.
fail_under = 58
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

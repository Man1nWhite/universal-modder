name: lawson LAS pack

# Builds dist/Miranda_Romance/Miranda_Romance_LAS.zip from the tracked ME2 source, proves the
# bytes equal the tracked pack, runs the suite, and keeps the pack as a workflow artifact.
# Nothing is published as a GitHub release: the packs ship in `dist/` (see AGENTS.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lawson-las-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: install build deps
        # the same dependency set the test workflow installs: pillow + numpy build the
        # pack, pyyaml is needed by the um/kb tests, and pytest runs them.
        # The versions are pinned, in tools/pd2-las/pins.txt: the tracked pack is compared byte for byte,
        # and a different Pillow/numpy or zlib changes the deflate output.
        run: python -m pip install --upgrade pip -c tools/pd2-las/pins.txt pillow numpy py7zr imageio-ffmpeg "pyyaml>=6" pytest pytest-cov hypothesis
      - name: verify the checked-in pack checksums
        run: python tools/pd2-las/pack_checksum.py
      - name: build the pack
        run: python tools/pd2-port/build_las_pack.py --out build/lawson-release/Miranda_Romance_LAS.zip
      - name: verify the build matches the tracked pack
        run: cmp dist/Miranda_Romance/Miranda_Romance_LAS.zip build/lawson-release/Miranda_Romance_LAS.zip
      - name: unpack 2B templates
        run: python tools/pd2-las/extract_2b.py
      - name: tests and skip budget
        run: |
          set -o pipefail
          mkdir -p build
          python -m pytest -q -rsxX tests | tee build/pytest-rsxX.txt
          python tools/pd2-port/check_skip_budget.py --report build/pytest-rsxX.txt
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lawson_las
          path: |
            dist/Miranda_Romance/Miranda_Romance_LAS.zip
            dist/Miranda_L4D2/Miranda_L4D2_LAS.zip
            dist/Miranda/Miranda_L4D2_over_Hila.zip
            dist/Miranda/Miranda_Romance_over_Hila.zip
          if-no-files-found: error

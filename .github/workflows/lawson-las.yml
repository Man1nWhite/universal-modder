name: lawson LAS pack

# Builds dist/Miranda_Romance/Miranda_Romance_LAS.zip from the tracked ME2 source and publishes it:
#  - every push to main: a workflow artifact with the pack;
#  - every lawson-las-vN tag (N >= 3): the pack as the asset of that GitHub release.
on:
  push:
    branches: [main]
    tags: ["lawson-las-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lawson-las-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install build deps
        # the same dependency set the test workflow installs: pillow + numpy build the
        # pack, pyyaml is needed by the um/kb tests, and pytest runs them.
        # The versions are pinned, in tools/pd2-las/pins.txt: the tracked pack is compared byte for byte,
        # and a different Pillow/numpy or zlib changes the deflate output.
        run: python -m pip install --upgrade pip -c tools/pd2-las/pins.txt pillow numpy py7zr imageio-ffmpeg "pyyaml>=6" pytest hypothesis
      - name: verify the checked-in pack checksums
        run: python tools/pd2-las/pack_checksum.py
      - name: build the pack
        # Tags must name a version in their notes, including on release reruns.
        # Branch builds use the builder's default.
        env:
          NOTES: tools/pd2-port/releases/${{ github.ref_name }}.md
        run: |
          args=()
          if [[ "${GITHUB_REF}" == refs/tags/lawson-las-v* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^lawson-las-v([0-9]+)$ ]] && (( 10#${BASH_REMATCH[1]} >= 3 )) || { echo "Tag must be lawson-las-vN with N >= 3: ${GITHUB_REF_NAME}" >&2; exit 1; }
            test -f "${NOTES}" || { echo "Missing notes for tag: ${NOTES}" >&2; exit 1; }
            VERSION=$(sed -nE '/<!--[[:space:]]*pack_version[[:space:]]*:/ {s/^[[:space:]]*<!--[[:space:]]*pack_version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*-->[[:space:]]*$/\1/; p;}' "${NOTES}")
            [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected one pack_version in ${NOTES}" >&2; exit 1; }
            echo "building version ${VERSION} (from ${NOTES})"
            args+=(--version "${VERSION}")
          fi
          python tools/pd2-port/build_las_pack.py --out build/lawson-release/Miranda_Romance_LAS.zip "${args[@]}"
      - name: verify the build matches the tracked pack
        run: cmp dist/Miranda_Romance/Miranda_Romance_LAS.zip build/lawson-release/Miranda_Romance_LAS.zip
      - name: unpack 2B templates
        run: python tools/pd2-las/extract_2b.py
      - name: tests and skip budget
        run: |
          set -o pipefail
          mkdir -p build
          python -m pytest -q -rsxX tests | tee build/pytest-rsxX.txt
          python tools/pd2-port/check_skip_budget.py --report build/pytest-rsxX.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lawson_las
          path: |
            dist/Miranda_Romance/Miranda_Romance_LAS.zip
            dist/Miranda_L4D2/Miranda_L4D2_LAS.zip
            dist/Miranda/Miranda_L4D2_over_Hila.zip
            dist/Miranda/Miranda_Romance_over_Hila.zip
          if-no-files-found: error
      - name: publish to the GitHub release
        if: startsWith(github.ref, 'refs/tags/lawson-las-v')
        working-directory: build/lawson-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="../../tools/pd2-port/releases/${GITHUB_REF_NAME}.md"
          cp ../../dist/Miranda_L4D2/Miranda_L4D2_LAS.zip .
          sha256sum Miranda_Romance_LAS.zip > Miranda_Romance_LAS.zip.sha256
          sha256sum Miranda_L4D2_LAS.zip > Miranda_L4D2_LAS.zip.sha256
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "Miranda Lawson — Legendary Armour Skins outfit ${GITHUB_REF_NAME#lawson-las-v}" \
              --notes-file "${notes}" \
              --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            Miranda_Romance_LAS.zip Miranda_Romance_LAS.zip.sha256 \
            Miranda_L4D2_LAS.zip Miranda_L4D2_LAS.zip.sha256 --clobber

name: test
# workflow_dispatch: so that the checks can be run by hand on a branch, from the
# Actions tab. Its one input picks the runner, for a one-off comparison on
# another architecture (ubuntu-24.04-arm); every other run is on ubuntu-latest.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: ubuntu-latest
jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # 20 minutes cancelled the last step mid-build (2026-11-18, this branch): it
    # started at 3m20s and was still rebuilding the packs when the cap hit. That
    # step rebuilds all packs from scratch and is the only long one, so the
    # cap has to cover it plus the ~3m the rest of the job takes; `main` with 19
    # packs finished the whole job in 18m42s, i.e. with no margin left.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the LAS pack is a byte-reproducible artifact: it must be built with the
      # same interpreter and library versions as the release workflow, or the
      # deflate output (and so the sha256) differs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: python -m pip install --upgrade pip -c tools/pd2-las/pins.txt pillow numpy py7zr imageio-ffmpeg "pyyaml>=6" pytest
        # The versions of pillow and numpy are those of tools/pd2-las/pins.txt.
      # ffmpeg enables the optional video and encoding tests. Without recommends apt skips mesa, VA/VDPAU drivers and
      # pocketsphinx-en-us (about half the download), and with man-db's auto-update off dpkg skips the man-page
      # reindex that can take minutes on the runner. When the Ubuntu mirror crawls (it has, at ~150 KB/s), the step
      # gives up after 3 minutes and the run goes on: those tests skip without ffmpeg instead of failing the build.
      - name: ffmpeg
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
      - name: unpack 2B templates
        run: python tools/pd2-las/extract_2b.py
      - name: verify the checked-in pack checksums
        # The suite reads the original artifacts. The independent rebuild
        # below writes only inside build/fresh/.
        run: python tools/pd2-las/pack_checksum.py
      - name: lint
        # unused imports and dead locals accumulate silently otherwise; this is the whole check
        run: python -m pip install --quiet pyflakes && python -m pyflakes um tools tests

      - name: tests and skip budget
        run: |
          set -o pipefail
          mkdir -p build
          python -m pytest -q -rsxX tests | tee build/pytest-rsxX.txt
          python tools/pd2-port/check_skip_budget.py --report build/pytest-rsxX.txt
      - run: ./bin/um --help && for g in scan fal comfy sprite render3d video win backup publish kb; do ./bin/um $g --help > /dev/null; done
      - name: knowledge base
        run: ./bin/um kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/um publish check .
      - name: every tracked pack must equal a fresh build, byte for byte
        # All 20 tracked packs are built again in a copy of the checkout, on
        # this runner, and each generated ZIP is compared to the verified byte
        # digest of the original. No copied outputs can count. `env` makes
        # the pinned .venv and unpacks the 2B templates first (node and npm,
        # for node-unrar-js). The builders put themselves on the declared code
        # path (tools/pd2-las/determinism.py), which is why a runner with
        # AVX-512 and one without build the same bytes. Before 2026-11-12 they
        # did not: docs/audits/2026-11-12-cpu-independence.md.
        # The runner's CPU, the code path and the result are also written as
        # notices: annotations are the one part of a run the GitHub API serves,
        # so a tool that cannot open the log can still read what happened.
        # On a runner that is not x86-64 (the one-off ARM comparison) the
        # declared code path does not exist: the builders are left free and the
        # step reports what differs.
        # Last in the job, and run even after a failure above, so that it
        # always reports.
        if: ${{ !cancelled() }}
        run: |
          make -sC tools/pd2-las env
          .venv/bin/python tools/pd2-las/fresh.py check ${{ runner.arch != 'X64' && '--free' || '' }}

name: test
# workflow_dispatch: so that the checks can be run by hand on a branch, from the
# Actions tab. Its one input picks the runner, for a one-off comparison on
# another architecture (ubuntu-24.04-arm); every other run is on ubuntu-latest.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: ubuntu-latest
jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the LAS pack is a byte-reproducible artifact: it must be built with the
      # same interpreter and library versions as the release workflow, or the
      # deflate output (and so the sha256) differs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: python -m pip install --upgrade pip "pillow==13.0.0" "numpy==2.4.6" "pyyaml>=6" pytest scipy
        # scipy is a hard dependency: bootstrap.sh installs it and the
        # elbow-depth test in tests/test_christie_las.py imports it.
      # ffmpeg is only for test_compile_small_edl. Without recommends apt skips mesa, VA/VDPAU drivers and
      # pocketsphinx-en-us (about half the download), and with man-db's auto-update off dpkg skips the man-page
      # reindex that can take minutes on the runner. When the Ubuntu mirror crawls (it has, at ~150 KB/s), the step
      # gives up after 8 minutes and the run goes on: that one test skips without ffmpeg instead of failing the build.
      - name: ffmpeg
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
      - name: build the LAS pack
        # the guide-compliance audit and its mutation self-test read the built
        # pack; without it those two tests silently skip, and a checker that
        # only runs on release tags is not a check
        run: python tools/pd2-port/build_las_pack.py
      - name: the tracked pack must equal a fresh build
        # a stale tracked pack (or a non-deterministic build) must not slip
        # through on a branch push
        run: |
          for sha_file in dist/*.zip.sha256 build/pd2-las/Miranda_LAS.zip.sha256; do
            sha256sum -c "$sha_file"
          done
      - name: lint
        # unused imports and dead locals accumulate silently otherwise; this is the whole check
        run: python -m pip install --quiet pyflakes && python -m pyflakes um tools tests

      - run: python -m pytest -q tests
      - run: ./bin/um --help && for g in scan fal comfy sprite render3d video win backup publish kb; do ./bin/um $g --help > /dev/null; done
      - name: knowledge base
        run: ./bin/um kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/um publish check .
      - name: a fresh build of the two Miranda LAS packs must be the tracked packs
        # the sidecar step above compares each zip with its own checksum, which a
        # stale pack passes. Here the builders run on this runner, from what is
        # in the repository: `env` makes the pinned .venv and unpacks the 2B
        # templates (node and npm, for node-unrar-js), `fresh` builds both packs
        # into build/fresh/ and compares them with the tracked ones member by
        # member. Not zip against zip: a .model depends on the CPU in two small
        # ways that tools/pd2-las/fresh_check.py names and allows, and runners
        # have more than one kind of CPU. Last in the job, so that the steps
        # above run as they always have, without the templates.
        # The runner's CPU and the comparison's own lines are also written as
        # notices: annotations are the one part of a run the GitHub API serves,
        # so a tool that cannot open the log can still read what happened.
        run: |
          echo "::notice title=runner::$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(nproc) threads, AVX-512 $(grep -qm1 avx512f /proc/cpuinfo && echo yes || echo no), AVX2 $(grep -qm1 avx2 /proc/cpuinfo && echo yes || echo no)"
          out=$(make -sC tools/pd2-las env fresh 2>&1) && status=0 || status=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -E 'members are the same|as allowed|DIFFERENT|no fresh build' | cut -c1-300 | sed 's/^ */::notice title=fresh build::/' || true
          if [ "$status" != 0 ]; then printf '%s\n' "$out" | tail -n 4 | sed 's/^/::error title=fresh build::/'; exit "$status"; fi
      - name: every tracked pack against a fresh build, byte for byte (reports only, for now)
        # All 14 packs are built again in a copy of the checkout and each of the
        # 16 tracked zips is compared with its tracked .sha256 by sha256sum -c.
        # Not blocking yet: on a runner without AVX-512 it is expected to report
        # 14 zips as different, and that expectation was written down before the
        # first run (docs/audits/2026-11-12-cpu-independence.md). It becomes the
        # gate when the cause is fixed. It reports through notices as well.
        continue-on-error: true
        run: .venv/bin/python tools/pd2-las/fresh.py check

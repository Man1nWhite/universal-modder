name: test
# Two jobs, because one of them is ten times the other:
#   `test`  — every gate that reads the tree: checksums, lint, links, docs index, the suite, the
#             skip budget, the CLI help, the knowledge base and the publish check. About 3 minutes.
#   `packs` — every tracked ZIP built again from scratch and compared byte for byte
#             (`tools/pd2-las/fresh.py check`). Quarter of an hour; the only slow step.
# Until 2026-11-26 both lived in one 35-minute job that ran on every push, so a docs typo cost a
# 15-minute rebuild and a superseded push kept a runner busy to the end. `packs` now runs when it
# can change the answer: a push to main, a tag, a nightly schedule, a manual run, or a pull
# request that carries the `rebuild-packs` label. `make -sC tools/pd2-las green` runs both locally.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"        # the packs are rebuilt nightly even when nothing changed
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: ubuntu-latest
      rebuild_packs:
        description: also rebuild every tracked pack (the `packs` job)
        type: boolean
        default: true
# One run per branch: a superseded push is cancelled instead of holding a runner to the end.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the LAS pack is a byte-reproducible artifact: it must be built with the
      # same interpreter and library versions as the release workflow, or the
      # deflate output (and so the sha256) differs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # the wheels are the same on every run; only pins.txt decides them
          cache: pip
          cache-dependency-path: tools/pd2-las/pins.txt
      - name: install deps
        run: python -m pip install --upgrade pip -c tools/pd2-las/pins.txt pillow numpy py7zr imageio-ffmpeg "pyyaml>=6" pytest hypothesis
        # The versions of pillow and numpy are those of tools/pd2-las/pins.txt.
      # ffmpeg enables the optional video and encoding tests. Without recommends apt skips mesa, VA/VDPAU drivers and
      # pocketsphinx-en-us (about half the download), and with man-db's auto-update off dpkg skips the man-page
      # reindex that can take minutes on the runner. When the Ubuntu mirror crawls (it has, at ~150 KB/s), the step
      # gives up after 3 minutes and the run goes on: those tests skip without ffmpeg instead of failing the build.
      - name: ffmpeg
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
      # Before anything reads a pack or the templates: both are release assets now, and the
      # templates come out of references/2b.rar.
      - name: the published packs and sources
        # dist/ and references/ are release assets, not tracked files (docs/pd2-las/RELEASE_ASSETS.md):
        # assets.json names their bytes. The cache is keyed on that manifest, so a run only
        # downloads them when a pack or an input was actually republished.
        uses: actions/cache@v4
        with:
          path: |
            dist
            references
          key: assets-${{ hashFiles('assets.json') }}
      - name: fetch every published asset
        # a no-op when the cache had them all: fetch verifies every sha256 either way
        run: make -sC tools/pd2-las fetch
      - name: unpack 2B templates
        run: python tools/pd2-las/extract_2b.py
      - name: verify the checked-in pack checksums
        # The suite reads the original artifacts. The independent rebuild in the
        # `packs` job writes only inside build/fresh/.
        run: python tools/pd2-las/pack_checksum.py
      - name: lint
        # unused imports and dead locals accumulate silently otherwise; this is the whole check
        run: python -m pip install --quiet pyflakes && python -m pyflakes um tools tests
      - name: documentation
        # every relative Markdown link resolves, and docs/README.md lists every document
        run: |
          python tools/pd2-port/check_links.py
          python tools/gen_docs_index.py --check
      - name: tests and skip budget
        run: |
          set -o pipefail
          mkdir -p build
          python -m pytest -q -rsxX tests | tee build/pytest-rsxX.txt
          python tools/pd2-port/check_skip_budget.py --report build/pytest-rsxX.txt
      - run: ./bin/um --help && for g in scan fal comfy sprite render3d video win backup publish kb; do ./bin/um $g --help > /dev/null; done
      - name: knowledge base
        run: ./bin/um kb check --index
      - name: nothing that shouldn't ship
        run: ./bin/um publish check .

  packs:
    # Every tracked pack must equal a fresh build, byte for byte. All 20 are built again in a
    # copy of the checkout, on this runner, and each generated ZIP is compared to the verified
    # byte digest of the original. No copied outputs can count. `env` makes the pinned .venv and
    # unpacks the 2B templates first (node and npm, for node-unrar-js). The builders put
    # themselves on the declared code path (tools/pd2-las/determinism.py), which is why a runner
    # with AVX-512 and one without build the same bytes. Before 2026-11-12 they did not:
    # docs/audits/2026-11-12-cpu-independence.md.
    # The runner's CPU, the code path and the result are also written as notices: annotations are
    # the one part of a run the GitHub API serves, so a tool that cannot open the log can still
    # read what happened.
    # On a runner that is not x86-64 (the one-off ARM comparison) the declared code path does not
    # exist: the builders are left free and the step reports what differs.
    needs: test
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.rebuild_packs)
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'rebuild-packs'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The packs and the inputs are release assets: this job needs them before it can verify or
      # rebuild anything (docs/pd2-las/RELEASE_ASSETS.md).
      - name: the published packs and sources
        uses: actions/cache@v4
        with:
          path: |
            dist
            references
          key: assets-${{ hashFiles('assets.json') }}
      - name: fetch every published asset
        run: make -sC tools/pd2-las fetch
      - name: verify the checked-in pack checksums
        run: python tools/pd2-las/pack_checksum.py
      - name: every tracked pack must equal a fresh build, byte for byte
        run: |
          make -sC tools/pd2-las env
          .venv/bin/python tools/pd2-las/fresh.py check ${{ runner.arch != 'X64' && '--free' || '' }}
